{% extends "base.html" %}

{% block content %}
<h1 style="text-align: center; color: #fff;">
    Create New Tile
</h1>

<form
    action="{{ url_for('tile_management.create_tile') }}"
    method="POST"
    style="
        width: calc(100% - 30px);
        max-width: 760px;
        margin: 0 auto;
        background-color: #1e1e1e;
        padding: 20px;
        border-radius: 10px;
        box-sizing: border-box;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
    "
>
    <div style="margin-bottom: 15px;">
        <label
            for="tile_name"
            style="display: block; margin-bottom: 5px; color: #ccc;"
        >
            Tile Name:
        </label>

        <input
            type="text"
            id="tile_name"
            name="tile_name"
            required
            style="
                width: 100%;
                padding: 10px;
                border: 1px solid #444;
                border-radius: 5px;
                background-color: #333;
                color: #ccc;
                box-sizing: border-box;
            "
        >
    </div>

    <div style="margin-bottom: 15px;">
        <label
            for="tile_points"
            style="display: block; margin-bottom: 5px; color: #ccc;"
        >
            Tile Points:
        </label>

        <input
            type="number"
            id="tile_points"
            name="tile_points"
            step="0.01"
            min="0"
            required
            style="
                width: 100%;
                padding: 10px;
                border: 1px solid #444;
                border-radius: 5px;
                background-color: #333;
                color: #ccc;
                box-sizing: border-box;
            "
        >
    </div>

    <div style="margin-bottom: 20px;">
        <label
            for="tile_rules"
            style="display: block; margin-bottom: 5px; color: #ccc;"
        >
            Tile Rules:
        </label>

        <textarea
            id="tile_rules"
            name="tile_rules"
            style="
                width: 100%;
                padding: 10px;
                border: 1px solid #444;
                border-radius: 5px;
                background-color: #333;
                color: #ccc;
                box-sizing: border-box;
                resize: vertical;
            "
        ></textarea>
    </div>

    <hr style="border-color: #444; margin: 25px 0;">

    <h2 style="color: #fff; margin-bottom: 5px;">
        Completion Conditions
    </h2>

    <p style="color: #aaa; margin-top: 0;">
        Each route can use <strong>ALL</strong>,
        <strong>SUM</strong>, or <strong>N OF</strong> logic.
        Separate routes are <strong>OR</strong> alternatives.
    </p>

    <div id="completion-routes"></div>

    <button
        type="button"
        onclick="addCompletionRoute()"
        style="
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            background-color: #555;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        "
    >
        + Add OR Completion Route
    </button>

    <button
        type="submit"
        style="
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background-color: #444;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        "
    >
        Create Tile
    </button>
</form>

<script>
    let nextRouteNumber = 1;

    function createConditionRow(routeNumber) {
        const row = document.createElement('div');

        row.className = 'condition-row';
        row.style.cssText = `
            display: grid;
            grid-template-columns: 1fr 2fr 1fr auto;
            gap: 10px;
            margin-bottom: 10px;
            align-items: end;
        `;

        row.innerHTML = `
            <input
                type="hidden"
                name="completion_path"
                value="${routeNumber}"
            >

            <div>
                <label style="
                    display: block;
                    margin-bottom: 5px;
                    color: #ccc;
                ">
                    Type
                </label>

                <select
                    name="condition_type"
                    required
                    onchange="conditionTypeChanged(this)"
                    style="
                        width: 100%;
                        padding: 10px;
                        border: 1px solid #444;
                        border-radius: 5px;
                        background-color: #333;
                        color: #ccc;
                        box-sizing: border-box;
                    "
                >
                    <option value="KILLCOUNT">Killcount</option>
                    <option value="EXPERIENCE">Experience</option>
                    <option value="METRIC">Metric</option>
                    <option value="DROP">Drop</option>
                    <option value="PET">Pet</option>
                    <option value="MANUAL">Manual</option>
                </select>
            </div>

            <div>
                <label style="
                    display: block;
                    margin-bottom: 5px;
                    color: #ccc;
                ">
                    Boss / Skill / Item / Pet
                </label>

                <input
                    type="text"
                    name="condition_trigger"
                    required
                    style="
                        width: 100%;
                        padding: 10px;
                        border: 1px solid #444;
                        border-radius: 5px;
                        background-color: #333;
                        color: #ccc;
                        box-sizing: border-box;
                    "
                >
            </div>

            <div>
                <label style="
                    display: block;
                    margin-bottom: 5px;
                    color: #ccc;
                ">
                    Amount
                </label>

                <input
                    type="number"
                    name="condition_target"
                    value="1"
                    min="1"
                    required
                    style="
                        width: 100%;
                        padding: 10px;
                        border: 1px solid #444;
                        border-radius: 5px;
                        background-color: #333;
                        color: #ccc;
                        box-sizing: border-box;
                    "
                >
            </div>

            <button
                type="button"
                onclick="removeCondition(this)"
                title="Remove condition"
                style="
                    padding: 10px 14px;
                    background-color: #663333;
                    color: #fff;
                    border: none;
                    border-radius: 5px;
                    cursor: pointer;
                "
            >
                X
            </button>
        `;

        return row;
    }

    function addCompletionRoute() {
        const routeNumber = nextRouteNumber;
        nextRouteNumber += 1;

        const routes = document.getElementById(
            'completion-routes'
        );

        const route = document.createElement('div');

        route.className = 'completion-route';
        route.dataset.routeNumber = routeNumber;

        route.style.cssText = `
            border: 1px solid #444;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            background-color: #282828;
        `;

        route.innerHTML = `
            <div style="
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 10px;
                margin-bottom: 12px;
            ">
                <strong style="color: #fff;">
                    Completion Route ${routeNumber}
                </strong>

                <button
                    type="button"
                    onclick="removeRoute(this)"
                    style="
                        padding: 7px 10px;
                        background-color: #663333;
                        color: #fff;
                        border: none;
                        border-radius: 5px;
                        cursor: pointer;
                    "
                >
                    Remove Route
                </button>
            </div>

            <input
                type="hidden"
                name="route_completion_path"
                value="${routeNumber}"
            >

            <div
                class="route-settings"
                style="
                    display: grid;
                    grid-template-columns: 1fr 1fr 1fr;
                    gap: 10px;
                    margin-bottom: 15px;
                "
            >
                <div>
                    <label style="
                        display: block;
                        margin-bottom: 5px;
                        color: #ccc;
                    ">
                        Route Mode
                    </label>

                    <select
                        name="route_mode"
                        onchange="routeModeChanged(this)"
                        style="
                            width: 100%;
                            padding: 10px;
                            border: 1px solid #444;
                            border-radius: 5px;
                            background-color: #333;
                            color: #ccc;
                            box-sizing: border-box;
                        "
                    >
                        <option value="ALL">
                            ALL - complete every condition
                        </option>
                        <option value="SUM">
                            SUM - shared total across conditions
                        </option>
                        <option value="N_OF">
                            N OF - complete a number of results
                        </option>
                    </select>
                </div>

                <div>
                    <label style="
                        display: block;
                        margin-bottom: 5px;
                        color: #ccc;
                    ">
                        Route Target
                    </label>

                    <input
                        type="number"
                        name="route_target"
                        min="1"
                        placeholder="Not used for ALL"
                        readonly
                        style="
                            width: 100%;
                            padding: 10px;
                            border: 1px solid #444;
                            border-radius: 5px;
                            background-color: #333;
                            color: #ccc;
                            box-sizing: border-box;
                        "
                    >
                </div>

                <div>
                    <label style="
                        display: block;
                        margin-bottom: 5px;
                        color: #ccc;
                    ">
                        Unique Results
                    </label>

                    <label style="
                        display: flex;
                        align-items: center;
                        min-height: 42px;
                        gap: 8px;
                        color: #ccc;
                    ">
                        <input
                            type="checkbox"
                            name="route_require_unique_${routeNumber}"
                            disabled
                        >
                        Require different conditions
                    </label>
                </div>
            </div>

            <div class="conditions"></div>

            <button
                type="button"
                onclick="addCondition(this)"
                style="
                    width: 100%;
                    padding: 9px;
                    margin-top: 5px;
                    background-color: #3d3d3d;
                    color: #fff;
                    border: none;
                    border-radius: 5px;
                    cursor: pointer;
                "
            >
                + Add AND Condition
            </button>
        `;

        routes.appendChild(route);

        const conditions = route.querySelector('.conditions');
        conditions.appendChild(
            createConditionRow(routeNumber)
        );
    }

    function addCondition(button) {
        const route = button.closest('.completion-route');
        const routeNumber = route.dataset.routeNumber;
        const conditions = route.querySelector('.conditions');

        conditions.appendChild(
            createConditionRow(routeNumber)
        );
    }

    function removeCondition(button) {
        const route = button.closest('.completion-route');
        const conditions = route.querySelectorAll(
            '.condition-row'
        );

        if (conditions.length <= 1) {
            alert(
                'A completion route must contain at least one condition.'
            );
            return;
        }

        button.closest('.condition-row').remove();
    }

    function removeRoute(button) {
        const routes = document.querySelectorAll(
            '.completion-route'
        );

        if (routes.length <= 1) {
            alert(
                'A tile must contain at least one completion route.'
            );
            return;
        }

        button.closest('.completion-route').remove();
    }

    function routeModeChanged(select) {
        const route = select.closest('.completion-route');

        const target = route.querySelector(
            '[name="route_target"]'
        );

        const unique = route.querySelector(
            'input[type="checkbox"][name^="route_require_unique_"]'
        );

        if (select.value === 'ALL') {
            target.value = '';
            target.readOnly = true;
            target.required = false;

            unique.checked = false;
            unique.disabled = true;
        } else if (select.value === 'SUM') {
            target.readOnly = false;
            target.required = true;

            unique.checked = false;
            unique.disabled = true;
        } else if (select.value === 'N_OF') {
            target.readOnly = false;
            target.required = true;

            unique.disabled = false;
        }
    }

    function conditionTypeChanged(select) {
        const row = select.closest('.condition-row');
        const trigger = row.querySelector(
            '[name="condition_trigger"]'
        );
        const target = row.querySelector(
            '[name="condition_target"]'
        );

        if (select.value === 'MANUAL') {
            trigger.value = '';
            trigger.required = false;
            trigger.disabled = false;
            trigger.placeholder = 'Not required';
            target.value = 1;
            target.readOnly = true;
        } else {
            trigger.required = true;
            trigger.placeholder = '';
            target.readOnly = false;
        }
    }

    addCompletionRoute();
</script>

<style>
    @media (max-width: 650px) {
        .condition-row {
            grid-template-columns: 1fr !important;
        }

        .condition-row button {
            width: 100%;
        }
    }
</style>
{% endblock %}
